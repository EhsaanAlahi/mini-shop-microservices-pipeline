name: minishop-microservice-e-commerce-system

services:

  # =========================
  # Admin Frontend
  # =========================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile

    container_name: minishop-admin

    env_file:
      - ./admin/.env

    ports:
      - "3000:3000"

    networks:
      - minishop-network

    depends_on:
      - kafka


  # =========================
  # User Service
  # =========================
  user_service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile

    container_name: minishop-user-service

    env_file:
      - ./services/user-service/.env

    ports:
      - "3001:3001"

    networks:
      - minishop-network

    depends_on:
      - kafka


  # =========================
  # Product Service
  # =========================
  product_service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile

    container_name: minishop-product-service

    env_file:
      - ./services/product-service/.env

    ports:
      - "3002:3002"

    networks:
      - minishop-network

    depends_on:
      - kafka


  # =========================
  # Apache Kafka - KRaft
  # =========================
  kafka:
    image: apache/kafka:4.0.0

    container_name: kafka

    hostname: kafka

    ports:
      - "9092:9092"
      - "9093:9093"

    environment:

      # -------------------------
      # KRaft Configuration
      # -------------------------
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093


      # -------------------------
      # Listeners
      # -------------------------
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER


      # -------------------------
      # Single Node Configuration
      # -------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


      # -------------------------
      # Development
      # -------------------------
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - minishop-network


# =========================
# Volumes
# =========================

volumes:

  kafka-data:


# =========================
# Networks
# =========================

networks:

  minishop-network:
    driver: bridge