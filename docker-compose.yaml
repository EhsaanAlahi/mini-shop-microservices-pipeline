name: minishop-microservice-e-commerce-system
services:
  admin:
    networks:
      - minishop-networks
    env_file:
      - ./admin/.env
    ports:
      - 3000:3000
    build:
      context: ./admin
      dockerfile: Dockerfile

  user_service:
    networks:
      - minishop-networks
    ports:
      - 3001:3001
    env_file:
      - ./services/user-service/.env
    build:
      context: ./services/user-service
      dockerfile: Dockerfile

  product_service:
    networks:
      - minishop-networks
    ports:
      - 3002:3002
    env_file:
      - ./services/product-service/.env
    build:
      context: ./services/product-service
      dockerfile: Dockerfile


networks:
  minishop-networks:
    driver: bridge