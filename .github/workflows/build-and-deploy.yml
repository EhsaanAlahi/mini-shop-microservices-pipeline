name: Build and Push MiniShop Images to Docker Hub

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

      matrix:
        service:
          - name: admin-panel
            context: ./admin
            image: minishop_admin
            frontend: true

          - name: user
            context: ./user
            image: minishop_user
            frontend: true

          - name: user-service
            context: ./services/user-service
            image: minishop_user_service
            frontend: false

          - name: product-service
            context: ./services/product-service
            image: minishop_product_service
            frontend: false

          - name: notification-service
            context: ./services/notification-service
            image: minishop_notification_service
            frontend: false

    steps:

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:latest

          build-args: |
            REACT_APP_API_URL=${{ matrix.service.frontend && secrets.REACT_APP_API_URL || '' }}
            REACT_APP_API_URL_PRODUCT=${{ matrix.service.frontend && secrets.REACT_APP_API_URL_PRODUCT || '' }}

          cache-from: type=gha
          cache-to: type=gha,mode=max