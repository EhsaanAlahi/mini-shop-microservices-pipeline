name:  Build Notification Service Image and Push to the Docker Hub


on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: admin
            context: ./admin
            image: minishop_admin

          - name: user
            context: ./user
            image: minishop_user

          - name: user-service
            context: ./services/user-service
            image: minishop_user_service

          - name: product-service
            context: ./services/product-service
            image: minishop_product_service

          - name: notification-service
            context: ./services/notification-service
            image: minishop_notification_service

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}:latest